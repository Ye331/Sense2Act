name: ci

# 一个仓库五个组件:按改动目录只跑相关 job(未改动的显示 skipped,不阻塞合入)。
# 本地等价命令见根目录 README「测试」表。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      signal: ${{ steps.filter.outputs.signal }}
      agent: ${{ steps.filter.outputs.agent }}
      collector: ${{ steps.filter.outputs.collector }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 改 CI 本身时全部组件都跑一遍
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            backend:
              - *ci
              - Backend/**
            signal:
              - *ci
              - signal-service/**
            agent:
              - *ci
              - agent/**
            collector:                 # 采集器复用 agent 的爬虫框架与后端客户端
              - *ci
              - collector/**
              - agent/requirements.txt
              - agent/sense2act/crawler/**
              - agent/sense2act/bridge/client.py
            frontend:
              - *ci
              - frontend/**

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: 构建与测试(含 Testcontainers 集成测试)
        run: mvn -B -ntp verify

  contract:
    # 仅 PR:origin/main 的 openapi 基线 vs 当前分支生成的 spec。
    # 改了接口就要重新生成基线(Backend/docs/openapi/baseline.json)并提交;
    # 破坏性变更(§9 路径/字段/状态值)必须先在 Backend/docs/api-design.md §11 登记并通知接入方。
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: 取基线 spec(PR 目标分支)
        run: |
          if git show "origin/${{ github.base_ref }}:Backend/docs/openapi/baseline.json" > /tmp/base.json 2>/dev/null; then
            echo "基线已取得"
          else
            echo '{}' > /tmp/base.json
            echo "目标分支尚无基线,跳过破坏性检查(本次合入建立首个基线)"
          fi
      - name: 生成当前分支 spec
        run: mvn -B -ntp test -Dtest=OpenApiBaselineTest -DupdateOpenapi=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: oasdiff 破坏性变更检查
        run: |
          if [ "$(cat /tmp/base.json)" = "{}" ]; then exit 0; fi
          docker run --rm \
            -v "$PWD/docs/openapi:/spec" \
            -v "/tmp:/hosttmp" \
            tufin/oasdiff:v1.33.0 breaking --fail-on ERR /hosttmp/base.json /spec/baseline.json \
            || { echo "::error::检测到破坏性 API 变更。先在 Backend/docs/api-design.md §11 登记并通知接入方,重新生成基线后再合入"; exit 1; }

  signal-service:
    needs: changes
    if: needs.changes.outputs.signal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: signal-service/requirements.txt
      - name: 安装依赖(CPU 版 torch,与镜像一致,避免拉 CUDA)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt "pytest>=8,<9"
      - name: 测试(单元测试用可控向量,不加载语义模型)
        run: python -m pytest -q

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: 测试(含 bridge 契约测试与评测不变量)
        run: python -m unittest discover -s tests -p "test_*.py"

  collector:
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    env:
      PYTHONPATH: ${{ github.workspace }}/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      - name: 测试(假后端校验 §9.1 接入不变量)
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 类型检查与构建
        run: npm run build
