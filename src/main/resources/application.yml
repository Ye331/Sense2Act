spring:
  application:
    name: sense2act-backend
  profiles:
    # 容器里由 compose 传 prod;IDE 本地跑默认 local
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sense2act}
    username: ${SPRING_DATASOURCE_USERNAME:sense2act}
    password: ${SPRING_DATASOURCE_PASSWORD:sense2act}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  paths-to-match: /api/v1/**

# 应用配置:值一律来自环境变量,环境差异不进代码(见 .env.example)
app:
  jwt:
    # 默认值仅供本地开发;prod profile 会用无默认的 ${JWT_SECRET} 覆盖,弱/缺密钥直接拒绝启动
    secret: ${JWT_SECRET:local-dev-only-secret-0123456789abcdef-CHANGE-ME}
    ttl: ${JWT_TTL:12h}
  internal-key: ${INTERNAL_API_KEY:}
  snapshot-dir: ${SNAPSHOT_DIR:./snapshots}
  embedding:
    # D12:外部 embedding 端点;不配置则语义检索降级为关键词,不报错
    endpoint: ${EMBEDDING_ENDPOINT:}
    api-key: ${EMBEDDING_API_KEY:}
    timeout: ${EMBEDDING_TIMEOUT:10s}
  seed:
    enabled: ${SEED_USERS_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    analyst-password: ${SEED_ANALYST_PASSWORD:analyst123}
    viewer-password: ${SEED_VIEWER_PASSWORD:viewer123}
  investigation:
    # D7:created 状态超过 TTL 未领取 → 定时任务置 failed
    created-ttl: ${INVESTIGATION_CREATED_TTL:60m}
    # E3-5:cost_estimate = token_used × 单价(元/token,演示口径)
    token-unit-price: ${TOKEN_UNIT_PRICE:0.00003}
